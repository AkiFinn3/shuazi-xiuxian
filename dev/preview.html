<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>预览（桌面尺寸）</title>
<style>
  html, body { margin: 0; background: #05070b; }
  #wrap { transform-origin: 0 0; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="../index.html"></iframe></div>
<script>
  const params = new URLSearchParams(location.search);
  const W = Number(params.get('w')) || 1440;
  const H = Number(params.get('h')) || 900;
  const wrap = document.getElementById('wrap');
  const frame = document.getElementById('f');
  wrap.style.width = W + 'px';
  wrap.style.height = H + 'px';
  frame.style.width = W + 'px';
  frame.style.height = H + 'px';
  function fit() {
    const s = Math.min(1, window.innerWidth / W);
    wrap.style.transform = 'scale(' + s + ')';
    document.body.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
