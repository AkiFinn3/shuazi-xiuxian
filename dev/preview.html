<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>预览（桌面尺寸）</title>
<style>
  html, body { margin: 0; background: #05070b; }
  #wrap { width: 1440px; height: 900px; transform-origin: 0 0; }
  iframe { width: 1440px; height: 900px; border: 0; display: block; }
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="../index.html"></iframe></div>
<script>
  // 按窗口宽度缩放预览窗口
  function fit() {
    const s = Math.min(1, window.innerWidth / 1440);
    document.getElementById('wrap').style.transform = 'scale(' + s + ')';
    document.body.style.height = (900 * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
